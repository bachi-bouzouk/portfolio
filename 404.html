<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Signal Lost — Abdel-Malek Imokrane</title>
<link rel="icon" type="image/x-icon" href="img/favicon.ico" />
<link rel="stylesheet" href="css/control-loop.css" />
<style>
  .lost-wrap { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden; }
  canvas#noise { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.5; }
  .lost-code { font-size: clamp(5rem, 22vw, 13rem); line-height: 0.85; color: var(--accent); margin: 0; position: relative; z-index: 2; }
  .lost-title { font-size: clamp(1.6rem, 4vw, 2.4rem); margin: 8px 0 16px; position: relative; z-index: 2; }
  .lost-note { font-family: 'Plex', sans-serif; color: var(--ink-dim); max-width: 50ch; font-size: 1rem; position: relative; z-index: 2; }
  .lost-home { display: inline-flex; align-items: center; gap: 8px; font-family: 'Plex Mono', monospace; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; text-decoration: none; color: var(--void); background: var(--accent); padding: 12px 20px; margin-top: 28px; position: relative; z-index: 2; width: fit-content; }
  .lost-home:hover { background: var(--signal-dim); }
</style>
</head>
<body>

<canvas id="noise"></canvas>

<main class="wrap lost-wrap">
  <div class="eyebrow">Signal lost</div>
  <h1 class="lost-code">404</h1>
  <h2 class="lost-title">This channel doesn't exist.</h2>
  <p class="lost-note">Whatever you were looking for isn't at this address. It may have moved, or never existed on this frequency.</p>
  <a class="lost-home" href="index.html">← Back to signal</a>
</main>

<script>
(function(){
  var canvas = document.getElementById('noise');
  var ctx = canvas.getContext('2d');
  function size(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
  }
  size();
  window.addEventListener('resize', size);

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function draw(){
    var w = canvas.width, h = canvas.height;
    var imageData = ctx.createImageData(w, h);
    var data = imageData.data;
    for (var i = 0; i < data.length; i += 4) {
      var v = Math.random() * 40;
      data[i] = data[i+1] = data[i+2] = v;
      data[i+3] = 18;
    }
    ctx.putImageData(imageData, 0, 0);
  }
  draw();
  if (!reduced) setInterval(draw, 120);
})();
</script>
</body>
</html>
